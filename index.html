<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Linux → DevOps → SRE Learning OS</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <header class="header">
    <h1>Linux → DevOps → SRE</h1>
    <p>Personal Learning OS</p>
  </header>

  <main class="page" id="app"></main>

  <nav class="bottom-nav">

    <button class="active" onclick="showPage('home')">
      🏠
      <br>
      خانه
    </button>

    <button onclick="showPage('roadmap')">
      🗺️
      <br>
      مسیر
    </button>

    <button onclick="showPage('reviews')">
      🔄
      <br>
      مرور
    </button>

    <button onclick="showPage('stats')">
      📊
      <br>
      آمار
    </button>

  </nav>

</div>

<script src="app.js"></script>

<script>

const app = document.getElementById("app");

function showPage(page) {

  document.querySelectorAll(".bottom-nav button")
    .forEach(button => button.classList.remove("active"));

  if (page === "home") {
    renderHome();
    document.querySelectorAll(".bottom-nav button")[0]
      .classList.add("active");
  }

  if (page === "roadmap") {
    renderRoadmap();
    document.querySelectorAll(".bottom-nav button")[1]
      .classList.add("active");
  }

  if (page === "reviews") {
    renderReviews();
    document.querySelectorAll(".bottom-nav button")[2]
      .classList.add("active");
  }

  if (page === "stats") {
    renderStats();
    document.querySelectorAll(".bottom-nav button")[3]
      .classList.add("active");
  }
}


function renderHome() {

  const currentSession = getCurrentSession();

  app.innerHTML = `

    <section class="card">

      <h2>👋 ادامه یادگیری</h2>

      <p>
        Session فعلی
      </p>

      <h3>
        ${currentSession}
      </h3>

      <div class="progress">
        <div
          class="progress-bar"
          style="width: 0%">
        </div>
      </div>

      <br>

      <button
        class="btn"
        onclick="openSession('${currentSession}')">
        ادامه Session
      </button>

    </section>


    <section class="grid">

      <div class="card stat">

        <div class="stat-value">
          0
        </div>

        <div class="stat-label">
          دقیقه امروز
        </div>

      </div>


      <div class="card stat">

        <div class="stat-value">
          0
        </div>

        <div class="stat-label">
          Session تکمیل‌شده
        </div>

      </div>

    </section>


    <section class="card">

      <h2>🎯 اقدام بعدی</h2>

      <p>
        اولین Session را شروع کن.
      </p>

      <button
        class="btn secondary"
        onclick="openSession('${currentSession}')">
        شروع ${currentSession}
      </button>

    </section>


    <section class="card">

      <h2>🔄 مرور</h2>

      <p>
        مرور عقب‌افتاده‌ای وجود ندارد.
      </p>

    </section>


    <section class="card">

      <h2>📈 پیشرفت</h2>

      <p>
        Linux
      </p>

      <div class="progress">
        <div
          class="progress-bar"
          style="width: 0%">
        </div>
      </div>

      <p>
        0 / 136 Session
      </p>

    </section>

  `;
}


function renderRoadmap() {

  app.innerHTML = `

    <section class="card">

      <h2>🗺️ Roadmap</h2>

      <p>
        مسیر کامل Linux → DevOps → SRE
      </p>

    </section>


    <section class="card">

      <h3>🐧 Linux</h3>

      <p>
        Phase 0 → Phase 8
      </p>

      <div class="progress">
        <div
          class="progress-bar"
          style="width: 0%">
        </div>
      </div>

      <br>

      <button
        class="btn"
        onclick="openSession('S01')">
        شروع Linux
      </button>

    </section>


    <section class="card">

      <h3>⚙️ DevOps / SRE</h3>

      <p>
        Phase 9 → Phase 17
      </p>

      <p>
        🔒 بعد از عبور از Linux Gate
      </p>

    </section>

  `;
}


function renderReviews() {

  app.innerHTML = `

    <section class="card">

      <h2>🔄 Reviews</h2>

      <p>
        مرورهای امروز
      </p>

      <h3>
        0
      </h3>

    </section>


    <section class="card">

      <h3>📅 برنامه مرور</h3>

      <p>
        +1d → +3d → +7d → +14d → +30d → +60d
      </p>

    </section>

  `;
}


function renderStats() {

  app.innerHTML = `

    <section class="card">

      <h2>📊 Statistics</h2>

      <p>
        آمار یادگیری شما
      </p>

    </section>


    <section class="grid">

      <div class="card stat">

        <div class="stat-value">
          0h
        </div>

        <div class="stat-label">
          زمان مطالعه
        </div>

      </div>


      <div class="card stat">

        <div class="stat-value">
          0%
        </div>

        <div class="stat-label">
          پیشرفت
        </div>

      </div>

    </section>


    <section class="card">

      <h3>🧠 Learning Health</h3>

      <p>
        هنوز داده‌ای برای تحلیل وجود ندارد.
      </p>

    </section>

  `;
}


function openSession(sessionId) {

  app.innerHTML = `

    <section class="card">

      <p>
        ← بازگشت
      </p>

      <h2>
        ${sessionId}
      </h2>

      <p>
        Session Page
      </p>

      <hr>

      <h3>🎯 Mission</h3>

      <p>
        محتوای آموزشی این Session
        از طریق ChatGPT ارائه می‌شود.
      </p>

    </section>


    <section class="card">

      <h3>📚 Parts</h3>

      <p>
        Parts در مرحله بعد اضافه می‌شوند.
      </p>

    </section>


    <section class="card">

      <h3>🧪 Lab</h3>

      <p>
        Lab هنوز شروع نشده است.
      </p>

    </section>


    <section class="card">

      <h3>📝 Exercises</h3>

      <p>
        L1 🔒
        L2 🔒
        L3 🔒
        L4 🔒
        L5 🔒
      </p>

    </section>

  `;
}


renderHome();

</script>

</body>
</html>

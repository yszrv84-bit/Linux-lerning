<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linux → DevOps Tracker</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #8b949e;
      margin-bottom: 25px;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .card h2 {
      margin-bottom: 15px;
    }

    .progress-container {
      background: #21262d;
      height: 14px;
      border-radius: 10px;
      overflow: hidden;
      margin: 15px 0;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #238636;
      transition: width 0.3s;
    }

    .progress-text {
      color: #8b949e;
    }

    .session {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .session-info h3 {
      margin-bottom: 7px;
    }

    .session-info p {
      color: #8b949e;
    }

    button {
      background: #238636;
      color: white;
      border: none;
      padding: 11px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      opacity: 0.9;
    }

    button.completed {
      background: #30363d;
      color: #8b949e;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat {
      background: #21262d;
      border-radius: 10px;
      padding: 18px;
      text-align: center;
    }

    .stat-number {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .stat-label {
      color: #8b949e;
      font-size: 13px;
    }

    .status {
      color: #3fb950;
      margin-top: 10px;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .session {
        flex-direction: column;
        align-items: stretch;
      }

      button {
        width: 100%;
      }

      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Linux → DevOps Tracker</h1>
    <p class="subtitle">
      Personal Linux → DevOps / SRE Learning System
    </p>

    <!-- Overall Progress -->
    <div class="card">
      <h2>Overall Progress</h2>

      <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <p class="progress-text" id="progressText">
        0 / 240 Sessions
      </p>
    </div>

    <!-- Current Session -->
    <div class="card">

      <h2>Current Session</h2>

      <div class="session">

        <div class="session-info">
          <h3 id="sessionTitle">
            S01 — Linux Fundamentals
          </h3>

          <p>
            Foundation of Linux, kernel, distribution,
            boot process and system architecture.
          </p>

          <div id="status" class="status"></div>
        </

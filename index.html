<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"

  >

  <title>
    Linux → DevOps → SRE Learning OS
  </title>

  <link
    rel="stylesheet"
    href="style.css"

<body>

<div class="app">

  <!-- =========================
       HEADER
  ========================== -->

  <header class="header">

    <h1>
      Linux → DevOps → SRE
    </h1>

    <p>
      Personal Learning OS
    </p>

  </header>


  <!-- =========================
       MAIN APP
  ========================== -->

  <main
    class="page"
    id="app"
  ></main>


  <!-- =========================
       BOTTOM NAVIGATION
  ========================== -->

  <nav class="bottom-nav">

    <button
      id="nav-home"
      onclick="showPage('home')"
    >

      id="nav-roadmap"
      onclick="showPage('roadmap')"

      مسیر

      onclick="showPage('reviews')"
    >

      مرور

      id="nav-stats"
      onclick="showPage('stats')"
    >

      <br>
      آمار
    </button>

  </nav>

</div>


<!-- =========================
     DATA
========================== -->

<script src="data.js"></script>


<!-- =========================
     APP LOGIC
========================== -->

<script src="app.js"></script>


<!-- =========================
     UI
========================== -->

<script>

const app =
  document.getElementById("app");


/* =========================
   NAVIGATION
========================= */

function setActiveNav(page) {

  document
    .querySelectorAll(".bottom-nav button")
    .forEach(button => {

      button.classList.remove("active");

    });


  const button =
    document.getElementById(
      `nav-${page}`
    );


  if (button) {
    button.classList.add("active");
  }

}


/* =========================
   PAGE ROUTER
========================= */

function showPage(page) {

  setActiveNav(page);


  if (page === "home") {

    renderHome();

    return;

  }


  if (page === "roadmap") {

    renderRoadmap();

    return;

  }


  if (page === "reviews") {

    renderReviews();

    return;

  }


  if (page === "stats") {

    renderStats();

    return;

  }

}


/* =========================
   SESSION HELPERS
========================= */

function getAllSessions() {

  const sessions = [];


  ROADMAP.forEach(phase => {

    phase.sessions.forEach(session => {

      sessions.push({

        id: session[0],

        title: session[1],

        phaseId: phase.id,

        phaseName: phase.name,

        track: phase.track

      });

    });

  });


  return sessions;

}


function findSession(sessionId) {

  return getAllSessions()
    .find(session => {

      return session.id === sessionId;

    });

}


function getCompletedSessionsCount() {

  return getAllSessions()
    .filter(session => {

      const data =
        getSessionData(session.id);

      return data.completion >= 100;

    })
    .length;

}


function getTotalStudyMinutes() {

  return APP_STATE.studyLogs
    .reduce(
      (total, log) => {

        return total +
          Number(log.durationMinutes || 0);

      },
      0
    );

}


function getTodayStudyMinutes() {

  const today =
    new Date()
      .toISOString()
      .slice(0, 10);


  return APP_STATE.studyLogs
    .filter(log => {

      return log.date === today;

    })
    .reduce(
      (total, log) => {

        return total +
          Number(log.durationMinutes || 0);

      },
      0
    );

}


function getLinuxProgress() {

  const linuxSessions =
    getAllSessions()
      .filter(session => {

        return session.track === "Linux";

      });


  if (!linuxSessions.length) {

    return 0;

  }


  const completed =
    linuxSessions.filter(session => {

      const data =
        getSessionData(session.id);

      return data.completion >= 100;

    }).length;


  return Math.round(
    completed /
    linuxSessions.length *
    100
  );

}


function getOverallProgress() {

  const sessions =
    getAllSessions();


  if (!sessions.length) {

    return 0;

  }


  const completed =
    getCompletedSessionsCount();


  return Math.round(
    completed /
    sessions.length *
    100
  );

}


/* =========================
   HOME
========================= */

function renderHome() {

  const currentSessionId =
    getCurrentSession();


  const currentSession =
    findSession(
      currentSessionId
    );


  const currentData =
    getSessionData(
      currentSessionId
    );


  const todayMinutes =
    getTodayStudyMinutes();


  const completed =
    getCompletedSessionsCount();


  const linuxProgress =
    getLinuxProgress();


  const overallProgress =
    getOverallProgress();


  const currentTitle =
    currentSession
      ? currentSession.title
      : "Session";


  app.innerHTML = `

    <section class="card">

      <div class="eyebrow">
        CURRENT SESSION
      </div>

      <h2>
        ${currentSessionId}
      </h2>

      <h3>
        ${currentTitle}
      </h3>

      <p class="muted">
        ${currentSession
          ? currentSession.phaseName
          : ""}
      </p>


      <div class="status-row">

        <span>
          ${getStatusIcon(
            currentData.learningStatus
          )}
          ${formatStatus(
            currentData.learningStatus
          )}
        </span>

        <span>
          ${currentData.completion || 0}%
        </span>

      </div>


      <div class="progress">

        <div
          class="progress-bar"
          style="
            width:
            ${currentData.completion || 0}%
          "
        ></div>

      </div>


      <br>


      <button
        class="btn"
        onclick="
          openSession(
            '${currentSessionId}'
          )
        "
      >
        ادامه Session
      </button>

    </section>


    <section class="grid">


      <div class="card stat">

        <div class="stat-value">
          ${todayMinutes}
        </div>

        <div class="stat-label">
          دقیقه امروز
        </div>

      </div>


      <div class="card stat">

        <div class="stat-value">
          ${completed}
        </div>

        <div class="stat-label">
          Session تکمیل‌شده
        </div>

      </div>


    </section>


    <section class="card">

      <div class="eyebrow">
        NEXT BEST ACTION
      </div>

      <h2>
        🎯 ${getNextAction()}
      </h2>

      <p class="muted">
        مسیر یادگیری را مرحله‌به‌مرحله ادامه بده.
      </p>

    </section>


    <section class="card">

      <h2>
        🔄 مرور
      </h2>

      <p>
        ${getPendingReviewsCount()}
        مرور در انتظار انجام
      </p>

      <button
        class="btn secondary"
        onclick="
          showPage('reviews')
        "
      >
        مشاهده مرورها
      </button>

    </section>


    <section class="card">

      <h2>
        📈 پیشرفت Linux
      </h2>

      <div class="progress">

        <div
          class="progress-bar"
          style="
            width:
            ${linuxProgress}%
          "
        ></div>

      </div>

      <p>
        ${linuxProgress}%
        — از 136 Session
      </p>

    </section>


    <section class="card">

      <h2>
        🚀 پیشرفت کل مسیر
      </h2>

      <div class="progress">

        <div
          class="progress-bar"
          style="
            width:
            ${overallProgress}%
          "
        ></div>

      </div>

      <p>
        ${overallProgress}%
        — از 240 Session
      </p>

    </section>

  `;

}


/* =========================
   ROADMAP
========================= */

function renderRoadmap() {

  let html = `

    <section class="card">

      <div class="eyebrow">
        LEARNING ROADMAP
      </div>

      <h2>
        🗺️ مسیر یادگیری
      </h2>

      <p class="muted">
        Linux → DevOps → SRE
      </p>

    </section>

  `;


  ROADMAP.forEach(phase => {

    const sessions =
      phase.sessions;


    let completed = 0;


    sessions.forEach(session => {

      const data =
        getSessionData(
          session[0]
        );


      if (
        data.completion >= 100
      ) {

        completed++;

      }

    });


    const total =
      sessions.length;


    const progress =
      total
        ? Math.round(
            completed /
            total *
            100
          )
        : 0;


    const locked =
      phase.track ===
      "DevOps / SRE";


    html += `

      <section class="card">

        <div class="phase-header">

          <div>

            <div class="eyebrow">
              ${phase.id}
            </div>

            <h2>
              ${locked ? "🔒" : "🐧"}
              ${phase.name}
            </h2>

            <p class="muted">
              ${phase.track}
            </p>

          </div>

          <div class="phase-count">
            ${completed}/${total}
          </div>

        </div>


        <div class="progress">

          <div
            class="progress-bar"
            style="
              width:
              ${progress}%
            "
          ></div>

        </div>


        <p class="muted">
          ${progress}% complete
        </p>


        <div class="session-list">

    `;


    sessions.forEach(session => {

      const sessionId =
        session[0];


      const title =
        session[1];


      const data =
        getSessionData(
          sessionId
        );


      const icon =
        getStatusIcon(
          data.learningStatus,
          data.completion
        );


      const isLocked =
        locked &&
        !isDevOpsUnlocked();


      html += `

        <button
          class="
            btn
            secondary
            session-button
            ${isLocked
              ? "locked"
              : ""}
          "

          ${
            isLocked
              ? "disabled"
              : ""
          }

          onclick="
            ${
              isLocked
                ? ""
                : `openSession('${sessionId}')`
            }
          "
        >

          <span>

            ${icon}

            <strong>
              ${sessionId}
            </strong>

            —
            ${title}

          </span>

          <span>
            ${data.completion || 0}%
          </span>

        </button>

      `;

    });


    html += `

        </div>

      </section>

    `;

  });


  app.innerHTML = html;

}


/* =========================
   REVIEWS
========================= */

function renderReviews() {

  const pending =
    APP_STATE.reviews
      .filter(review => {

        return review.status !== "DONE";

      });


  const overdue =
    pending.filter(review => {

      return (
        review.dueDate &&
        review.dueDate <
        getTodayDate()
      );

    });


  let html = `

    <section class="card">

      <div class="eyebrow">
        SPACED REPETITION
      </div>

      <h2>
        🔄 مرورها
      </h2>

      <p>
        ${pending.length}
        مرور در انتظار انجام
      </p>

      <p>
        ${overdue.length}
        مرور عقب‌افتاده
      </p>

    </section>

  `;


  if (!pending.length) {

    html += `

      <section class="card">

        <h3>
          ✅ فعلاً مروری نداری
        </h3>

        <p class="muted">
          بعد از تکمیل Sessionها، برنامه مرور
          +1d، +3d، +7d، +14d، +30d و +60d
          به‌صورت خودکار ساخته می‌شود.
        </p>

      </section>

    `;

  }


  pending.forEach(review => {

    const session =
      findSession(
        review.session
      );


    html += `

      <section class="card">

        <div class="eyebrow">
          ${review.type || "REVIEW"}
        </div>

        <h3>
          ${review.session}
          —
          ${
            session
              ? session.title
              : ""
          }
        </h3>

        <p>
          📅
          ${review.dueDate || "-"}
        </p>

        <button
          class="btn"
          onclick="
            openSession(
              '${review.session}'
            )
          "
        >
          انجام مرور
        </button>

      </section>

    `;

  });


  app.innerHTML = html;

}


/* =========================
   STATS
========================= */

  const totalMinutes =
    getTotalStudyMinutes();


  const totalHours =
    Math.floor(
      totalMinutes / 60

  const remainingMinutes =
    totalMinutes % 60;

    getOverallProgress();


  const completed =
    getCompletedSessionsCount();


  const totalSessions =
    getAllSessions().length;


  const labPassed =
    getAllSessions()
      .filter(session => {

        const data =
          getSessionData(
            session.id
          );


        return (
          data.labStatus ===
          "PASSED"
        );

      })
      .length;


  app.innerHTML = `

    <section class="card">

      <div class="eyebrow">
        LEARNING ANALYTICS
      </div>

      <h2>
        📊 آمار یادگیری
      </h2>

      <p class="muted">
        وضعیت کلی مسیر یادگیری
      </p>

    </section>


    <section class="grid">


      <div class="card stat">

        <div class="stat-value">
          ${totalHours}h
        </div>

        <div class="stat-label">
          ساعت مطالعه
        </div>

      </div>


      <div class="card stat">

        <div class="stat-value">
          ${remainingMinutes}
        </div>

        <div class="stat-label">
          دقیقه اضافه
        </div>

      </div>


      <div class="card stat">

        <div class="stat-value">
          ${completed}
        </div>

        <div class="stat-label">
          Session
        </div>

      </div>


      <div class="card stat">

        <div class="stat-value">
          ${labPassed}
        </div>

        <div class="stat-label">
          Lab Passed
        </div>

      </div>


    </section>


    <section class="card">

      <h2>
        📈 Progress
      </h2>

      <div class="progress">

        <div
          class="progress-bar"
          style="
            width:
            ${progress}%
          "
        ></div>

      </div>

      <p>
        ${completed}
        /
        ${totalSessions}
        Session
      </p>

    </section>


    <section class="card">

      <h2>
        🧠 Learning Health
      </h2>

      <p>
        وضعیت سلامت یادگیری با داده‌های
        واقعی Session، Review، Lab و Assessment

}


/* =========================

========================= */

    findSession(

  }

  );


  const data =
    getSessionData(
      sessionId

  app.innerHTML = `

    <section class="card">

      <button
        class="btn secondary"
        onclick="
          showPage('roadmap')
        "
      >
        ← بازگشت به مسیر
      </button>

      <br>
      <br>

      <div class="eyebrow">
        ${session.phaseId}
      </div>

      <h2>
        ${session.id}
      </h2>

    </section>

      </div>

    </section>


    <section class="card">

        ⏱ Study

        ${renderExercise(

        )}

        ${renderExercise(
          "L5",

/* =========================
   SESSION NAVIGATION
========================= */

function getPreviousSession(
  sessionId
) {

  const sessions =
    getAllSessions();


  const index =
    sessions.findIndex(
      session =>
        session.id === sessionId
    );


  if (
    index <= 0
  ) {

    return null;

  }


  return sessions[
    index - 1
  ];

}


function getNextSession(
  sessionId
) {

  const sessions =
    getAllSessions();


  const index =
    sessions.findIndex(
      session =>
        session.id === sessionId
    );


  if (
    index < 0 ||
    index >= sessions.length - 1
  ) {

    return null;

  }


  return sessions[
    index + 1
  ];

}


/* =========================
   EXERCISES
========================= */

function renderExercise(
  level,
  status
) {

  return `

    <div class="exercise">

      <strong>
        ${level}
      </strong>

      <span>
        ${formatExerciseStatus(
          status
        )}
      </span>

    </div>

  `;

}


/* =========================
   STATUS
========================= */

function getStatusIcon(
  status,
  completion = 0
) {

  if (
    completion >= 100
  ) {

    return "✅";

  }


  switch(status) {

    case "INTRODUCED":
      return "🟠";

    case "PRACTICING":
      return "🟡";

    case "COMPETENT":
      return "🟢";

    case "MASTERED":
      return "🔵";

    default:
      return "🔴";

  }

}


function formatStatus(
  status
) {

  switch(status) {

    case "INTRODUCED":
      return "Introduced";

    case "PRACTICING":
      return "Practicing";

    case "COMPETENT":
      return "Competent";

    case "MASTERED":
      return "Mastered";

    default:
      return "Not Started";

  }

}


function formatExerciseStatus(
  status
) {

  switch(status) {

    case "PASSED":
      return "✅ Passed";

    case "FAILED":
      return "❌ Failed";

    case "IN_PROGRESS":
      return "🟡 In Progress";

    case "LOCKED":
      return "🔒 Locked";

    default:
      return "⚪ Not Started";

  }

}


function formatLabStatus(
  status
) {

  switch(status) {

    case "PASSED":
      return "✅ Passed";

    case "FAILED":
      return "❌ Failed";

    case "IN_PROGRESS":
      return "🟡 In Progress";

    case "SKIPPED":
      return "⏭ Skipped";

    default:
      return "⚪ Not Started";

  }

}


/* =========================
   DATE
========================= */

function getTodayDate() {

  return new Date()
    .toISOString()
    .slice(0, 10);

}


/* =========================
   REVIEWS
========================= */

function getPendingReviewsCount() {

  return APP_STATE.reviews
    .filter(review => {

      return review.status !== "DONE";

    })
    .length;

}


/* =========================
   NEXT ACTION
========================= */

function getNextAction() {

  const overdue =
    APP_STATE.reviews
      .filter(review => {

        return (
          review.status !== "DONE" &&
          review.dueDate &&
          review.dueDate <
          getTodayDate()
        );

      });


  if (
    overdue.length
  ) {

    return "مرور عقب‌افتاده را انجام بده";

  }


  const currentSession =
    getCurrentSession();


  const currentData =
    getSessionData(
      currentSession
    );


  if (
    currentData.completion <
    100
  ) {

    return `
      ادامه ${currentSession}
    `;

  }


  const next =
    getNextSession(
      currentSession
    );


  if (next) {

    return `
      شروع ${next.id}
    `;

  }


  return "مسیر را بررسی کن";

}


/* =========================
   DEVOPS GATE
========================= */

function isDevOpsUnlocked() {

  return (
    APP_STATE.gates &&
    APP_STATE.gates.linux &&
    APP_STATE.gates.linux.status ===
    "PASSED"
  );

}


/* =========================
   DEMO COMPLETION
========================= */

function completeDemoSession(
  sessionId
) {

  updateState(state => {

    const data =
      getSessionData(
        sessionId
      );


    data.completion = 100;

    data.learningStatus =
      "PRACTICING";


    state.sessionData[
      sessionId
    ] = data;


    state.settings.currentSession =
      sessionId;

  });


  alert(
    `${sessionId} completed`
  );


  openSession(
    sessionId
  );

}

}

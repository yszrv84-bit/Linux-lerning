<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Linux → DevOps Tracker</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    padding: 16px;
}

.container {
    max-width: 1000px;
    margin: auto;
}

header {
    margin-bottom: 25px;
}

h1 {
    font-size: 28px;
    margin-bottom: 8px;
}

.subtitle {
    color: #8b949e;
}

.card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
}

.progress-container {
    height: 14px;
    background: #21262d;
    border-radius: 20px;
    overflow: hidden;
    margin: 12px 0;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #238636;
    transition: width .3s;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.stat {
    background: #21262d;
    padding: 16px;
    border-radius: 10px;
}

.stat-number {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 5px;
}

.stat-label {
    color: #8b949e;
    font-size: 13px;
}

.phase {
    margin-bottom: 14px;
    border: 1px solid #30363d;
    border-radius: 12px;
    overflow: hidden;
}

.phase-header {
    padding: 16px;
    background: #1c2128;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.phase-title {
    font-weight: bold;
}

.phase-progress {
    color: #8b949e;
    font-size: 13px;
}

.sessions {
    padding: 8px;
}

.session {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 5px;
}

.session:hover {
    background: #21262d;
}

.session-checkbox {
    width: 20px;
    height: 20px;
    accent-color: #238636;
}

.session-number {
    color: #8b949e;
    min-width: 45px;
    font-size: 13px;
}

.session-title {
    flex: 1;
}

.completed {
    text-decoration: line-through;
    color: #6e7681;
}

.badge {
    font-size: 11px;
    padding: 4px 7px;
    border-radius: 8px;
    background: #21262d;
    color: #8b949e;
}

.linux-badge {
    color: #58a6ff;
}

.devops-badge {
    color: #d2a8ff;
}

button {
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    background: #238636;
    color: white;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

.reset-button {
    background: #da3633;
}

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.current-session {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.current-info h2 {
    margin-bottom: 7px;
}

.current-info p {
    color: #8b949e;
}

@media (max-width: 650px) {

    body {
        padding: 10px;
    }

    h1 {
        font-size: 23px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .current-session {
        flex-direction: column;
        align-items: stretch;
    }

    .session {
        align-items: flex-start;
    }

    .session-title {
        font-size: 14px;
    }

    .badge {
        display: none;
    }
}

</style>
</head>

/*
========================================
STORAGE
========================================
*/

let completed =
JSON.parse(
localStorage.getItem("completedSessions") || "[]"
);


/*
========================================
HELPERS
========================================
*/

function isCompleted(id) {
    return completed.includes(id);
}


function save() {

    localStorage.setItem(
        "completedSessions",
        JSON.stringify(completed)
    );

}


/*
========================================
COMPLETE / UNCOMPLETE
========================================
*/

function toggleSession(id) {

    if (isCompleted(id)) {

        completed =
        completed.filter(
            session => session !== id
        );

    } else {

        completed.push(id);

    }

    save();

    render();

}


/*
========================================
CURRENT SESSION
========================================
*/

function getCurrentSession() {

    for (const phase of phases) {

        for (const session of phase.sessions) {

            if (!isCompleted(session[0])) {

                return session;

            }

        }

    }

    return null;

}


function completeCurrent() {

    const current =
    getCurrentSession();

    if (!current) {

        alert("All 240 sessions are completed! 🎉");

        return;

    }

    toggleSession(current[0]);

}


/*
========================================
RENDER ROADMAP
========================================
*/

function render() {

    const roadmap =
    document.getElementById("roadmap");

    roadmap.innerHTML = "";

    let totalCompleted = completed.length;

    let completedPhases = 0;


    phases.forEach((phase, index) => {

        const phaseCompleted =
        phase.sessions.filter(
            session => isCompleted(session[0])
        ).length;


        if (
            phaseCompleted ===
            phase.sessions.length
        ) {

            completedPhases++;

        }


        const phaseElement =
        document.createElement("div");

        phaseElement.className = "phase";


        const header =
        document.createElement("div");

        header.className = "phase-header";

        header.innerHTML = `

            <div>

                <div class="phase-title">
                    ${phase.name}
                </div>

                <div class="phase-progress">
                    ${phase.range}
                </div>

            </div>

            <div class="phase-progress">
                ${phaseCompleted}/${phase.sessions.length}
            </div>

        `;


        const sessionsContainer =
        document.createElement("div");

        sessionsContainer.className =
        "sessions";


        phase.sessions.forEach(session => {

            const id = session[0];
            const title = session[1];

            const checked =
            isCompleted(id);

            const row =
            document.createElement("div");

            row.className = "session";


            row.innerHTML = `

                <input
                    class="session-checkbox"
                    type="checkbox"
                    ${checked ? "checked" : ""}
                    onchange="toggleSession('${id}')"
                >

                <div class="session-number">
                    ${id}
                </div>

                <div class="
                    session-title
                    ${checked ? "completed" : ""}
                ">
                    ${title}
                </div>

                <div class="
                    badge
                    ${phase.type === "Linux"
                        ? "linux-badge"
                        : "devops-badge"}
                ">
                    ${phase.type}
                </div>

            `;


            sessionsContainer.appendChild(row);

        });


        phaseElement.appendChild(header);

        phaseElement.appendChild(
            sessionsContainer
        );

        roadmap.appendChild(
            phaseElement
        );

    });


    /*
    ========================================
    GLOBAL PROGRESS
    ========================================
    */

    const progress =
    (totalCompleted / 240) * 100;


    document.getElementById(
        "progressBar"
    ).style.width =
    progress + "%";


    document.getElementById(
        "progressText"
    ).textContent =
    `${totalCompleted} / 240 Sessions — ${progress.toFixed(1)}%`;


    document.getElementById(
        "completedCount"
    ).textContent =
    totalCompleted;


    document.getElementById(
        "remainingCount"
    ).textContent =
    240 - totalCompleted;


    document.getElementById(
        "phaseCount"
    ).textContent =
    completedPhases;


    /*
    ========================================
    CURRENT SESSION
    ========================================
    */

    const current =
    getCurrentSession();


    if (current) {

        document.getElementById(
            "currentTitle"
        ).textContent =
        `${current[0]} — ${current[1]}`;

        document.getElementById(
            "currentDescription"
        ).textContent =
        "Your next session in the roadmap.";

    } else {

        document.getElementById(
            "currentTitle"
        ).textContent =
        "🎉 Roadmap Completed";

        document.getElementById(
            "currentDescription"
        ).textContent =
        "You completed all 240 sessions.";

    }

}


/*
========================================
RESET
========================================
*/

function resetProgress() {

    const confirmed =
    confirm(
        "Reset ALL session progress?"
    );

    if (!confirmed) return;

    completed = [];

    save();

    render();

}


/*
========================================
START
========================================
*/

render();

</script>

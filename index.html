* {

  localStorage.setItem(

  );

  localStorage.setItem(
    "sessionData",
    JSON.stringify(sessionData)
  );
}


/* =========================================================
   HELPERS
========================================================= */

function allSessions() {
  return phases.flatMap(p => p.sessions);
}


function findSession(id) {
  for (const phase of phases) {
    const found = phase.sessions.find(s => s[0] === id);

    if (found) {
      return {
        phase,
        id: found[0],
        title: found[1]
      };
    }
  }

  return null;
}


function getNextSession() {
  return allSessions().find(s => !completedSessions.includes(s[0]));
}


/* =========================================================
   DASHBOARD
========================================================= */

function renderDashboard() {

  const all = allSessions();

  const completed = completedSessions.length;
  const remaining = all.length - completed;
  const percent = Math.round((completed / all.length) * 100);

  document.getElementById("completedCount").textContent = completed;
  document.getElementById("remainingCount").textContent = remaining;
  document.getElementById("percentCount").textContent = percent + "%";
  document.getElementById("overallFill").style.width = percent + "%";


  const next = getNextSession();
  const nextBox = document.getElementById("nextBox");

  if (!next) {

    nextBox.innerHTML = `
      <h2>🎉 مسیر کامل شد!</h2>
      <p class="muted">
        هر 240 Session تکمیل شده‌اند.
      </p>
    `;

  } else {

    nextBox.innerHTML = `
      <h2>🎯 Session بعدی</h2>

      <div class="badge">${next[0]}</div>

      <h3>${next[1]}</h3>

      <p class="muted">
        برای شروع، وارد Session شو.
      </p>

      <button
        class="btn"
        onclick="openSession('${next[0]}')">
        شروع Session →
      </button>
    `;
  }


  renderPhases();
}


function renderPhases() {

  const container = document.getElementById("phases");

  container.innerHTML = "";

  phases.forEach((phase, index) => {

    const done = phase.sessions.filter(
      s => completedSessions.includes(s[0])
    ).length;

    const total = phase.sessions.length;

    const phaseEl = document.createElement("div");

    phaseEl.className = "phase";

    if (index === 0) {
      phaseEl.classList.add("open");
    }

    phaseEl.innerHTML = `

      <div
        class="phase-header"
        onclick="togglePhase(this.parentElement)">

        <div>
          <div class="phase-title">
            ${phase.title}
          </div>

          <div class="phase-progress">
            ${done} / ${total} completed
          </div>
        </div>

        <div>⌄</div>

      </div>

      <div class="sessions">

        ${phase.sessions.map(session => {

          const id = session[0];
          const title = session[1];

          const isDone =
            completedSessions.includes(id);

          return `

            <button
              class="session ${isDone ? "completed" : ""}"
              onclick="openSession('${id}')">

              <span class="session-id">
                ${id}
              </span>

              —
              ${title}

              ${
                isDone
                ? `<span class="check">✓</span>`
                : ""
              }

            </button>

          `;

        }).join("")}

      </div>
    `;

    container.appendChild(phaseEl);
  });
}


function togglePhase(element) {
  element.classList.toggle("open");
}

function openSession(id) {

  const session = findSession(id);

  if (!session) return;

  document.getElementById("dashboard")
    .classList.add("hidden");

  document.getElementById("sessionDetail")
    .classList.remove("hidden");

  renderSession(session);
}

        ${session.id} — ${session.title}
      </div>

      <div class="muted">
        ${session.phase.title}
      </div>

    </div>


    <div class="card">

      <h3>📚 Parts</h3>

      ${parts.map((part, i) => `

        <div class="part">

          <strong>
            Part ${i + 1} — ${part.title}
          </strong>

          <p class="muted">
            ${part.description}
          </p>

        </div>

      `).join("")}

    </div>


    <div class="card">

      <h3>🧠 وضعیت یادگیری</h3>

      <div class="status-grid">

        ${["🔴","🟠","🟡","🟢","🔵"].map(s => `

          <button
            class="status-btn ${status === s ? "active" : ""}"
            onclick="setStatus('${session.id}','${s}')">

            ${s}

          </button>

        `).join("")}

      </div>

    </div>


    <div class="card">

      <h3>🧪 Lab</h3>

      <p>
        این بخش محل Lab عملی Session است.
      </p>

      <div class="danger-box">

        ⚠️ قبل از اجرای Commandهای خطرناک:
        <br><br>

        <strong>Risk → Blast Radius → Verification → Rollback</strong>

        <br><br>

        هیچ Command مخربی را بدون توضیح و بررسی اجرا نکن.

      </div>

    </div>


    <div class="card">

      <h3>🎯 Exercises</h3>

      ${["L1","L2","L3","L4","L5"].map((level, i) => `

        <div class="exercise">

          <strong>${level}</strong>

          <p class="muted">
            ${
              [
                "آشنایی و اجرای ساده",
                "تمرین پایه",
                "سناریوی واقعی",
                "Troubleshooting",
                "سناریوی Production"
              ][i]
            }
          </p>

        </div>

      `).join("")}

    </div>


    <div class="card">

      <h3>📝 یادداشت‌های من</h3>

      <textarea
        id="notes"
        placeholder="نکته‌ها، خطاها، Commandها و چیزهایی که باید مرور کنم..."
        oninput="saveNotes('${session.id}')">${escapeHtml(notes)}</textarea>

    </div>


    <div class="card">

      <h3>🔄 Review Schedule</h3>

      ${renderReviews(session.id, reviews)}

    </div>


    <div class="card">

      <h3>✅ Session Status</h3>

      <p>
        ${
          isCompleted
          ? "این Session تکمیل شده است."
          : "این Session هنوز تکمیل نشده است."
        }
      </p>

      <button
        class="btn ${isCompleted ? "secondary" : "success"}"
        onclick="toggleComplete('${session.id}')">

        ${
          isCompleted
          ? "↩️ علامت‌گذاری به عنوان ناتمام"
          : "✅ Complete Session"
        }

      </button>

    </div>


    <div class="card">

      <h3>🧭 Navigation</h3>

      <div class="nav-buttons">

        ${
          previous
          ? `
            <button
              class="btn secondary"
              onclick="openSession('${previous.id}')">
              ← ${previous.id}
            </button>
          `
          : ""
        }

        ${
          next
          ? `
            <button
              class="btn"
              onclick="goNext('${session.id}')"
              ${!isCompleted ? "disabled" : ""}>
              بعدی → ${next.id}
            </button>
          `
          : ""
        }

      </div>

      ${
        next && !isCompleted
        ? `
          <p class="muted">
            برای رفتن به Session بعدی، ابتدا این Session را Complete کن.
          </p>
        `
        : ""
      }

    </div>
  `;
}


/* =========================================================
   PARTS
========================================================= */

function getDefaultParts(session) {

  const title = session.title;

  if (session.id === "S01") {

    return [
      {
        title: "Architecture",
        description:
          "طراحی محیط Lab، نقش Serverها، Network و مسیر یادگیری."
      },
      {
        title: "Production Thinking",
        description:
          "چرا Admin/SRE باید قبل از تغییر، اثر آن را بررسی کند."
      },
      {
        title: "Safety",
        description:
          "Risk، Blast Radius، Verification و Rollback."
      }
    ];

  }

  return [

    {
      title: "Concepts",
      description:
        `مفاهیم اصلی ${title} به زبان ساده و سپس عمیق.`
    },

    {
      title: "Production",
      description:
        "مثال واقعی از محیط Production و Datacenter."
    },

    {
      title: "Lab",
      description:
        "تمرین عملی و مشاهده نتیجه."
    },

    {
      title: "Troubleshooting",
      description:
        "Observe → Data → Hypothesis → Test → Fix → Verify → Prevent."
    }

  ];
}


/* =========================================================
   REVIEWS
========================================================= */

function renderReviews(id, reviews) {

  const reviewTypes = [
    ["+1d","مرور بعد از 1 روز"],
    ["+3d","مرور بعد از 3 روز"],
    ["+7d","مرور بعد از 7 روز"],
    ["+14d","مرور بعد از 14 روز"],
    ["+30d","مرور بعد از 30 روز"],
    ["+60d","مرور بعد از 60 روز"]
  ];

  return reviewTypes.map(r => {

    const done = reviews[r[0]] === true;

    return `

      <div class="review ${done ? "done" : ""}">

        <span>
          ${r[0]} — ${r[1]}
        </span>

        <button
          onclick="toggleReview('${id}','${r[0]}')">

          ${done ? "✓ انجام شد" : "انجام شد"}

        </button>

      </div>

    `;

  }).join("");
}


function toggleReview(id, review) {

  if (!sessionData[id]) {
    sessionData[id] = {};
  }

  if (!sessionData[id].reviews) {
    sessionData[id].reviews = {};
  }

  sessionData[id].reviews[review] =
    !sessionData[id].reviews[review];

  saveData();

  const session = findSession(id);

  if (session) renderSession(session);
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(id, status) {

  if (!sessionData[id]) {
    sessionData[id] = {};
  }

  sessionData[id].status = status;

  saveData();

  const session = findSession(id);

  if (session) renderSession(session);
}


/* =========================================================
   NOTES
========================================================= */

function saveNotes(id) {

  const notes =
    document.getElementById("notes").value;

  if (!sessionData[id]) {
    sessionData[id] = {};
  }

  sessionData[id].notes = notes;

  saveData();
}


/* =========================================================
   COMPLETE
========================================================= */

function toggleComplete(id) {

  const index =
    completedSessions.indexOf(id);

  if (index === -1) {

    completedSessions.push(id);

  } else {

    completedSessions.splice(index, 1);

  }

  saveData();

  const session = findSession(id);

  if (session) {
    renderSession(session);
  }
}


/* =========================================================
   NAVIGATION
========================================================= */

function getPreviousSession(id) {

  const all = allSessions();

  const index =
    all.findIndex(s => s[0] === id);

  if (index <= 0) return null;

  return findSession(all[index - 1][0]);
}


function getFollowingSession(id) {

  const all = allSessions();

  const index =
    all.findIndex(s => s[0] === id);

  if (index === -1 || index >= all.length - 1) {
    return null;
  }

  return findSession(all[index + 1][0]);
}


function goNext(id) {

  if (!completedSessions.includes(id)) {
    alert("ابتدا این Session را Complete کن.");
    return;
  }

  const next = getFollowingSession(id);

  if (next) {
    openSession(next.id);
  }
}


/* =========================================================
   DASHBOARD / RESET
========================================================= */

function showDashboard() {

  document.getElementById("sessionDetail")
    .classList.add("hidden");

  document.getElementById("dashboard")
    .classList.remove("hidden");

  renderDashboard();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


function resetProgress() {

  const ok =
    confirm(
      "مطمئنی می‌خواهی تمام Progress و Sessionها پاک شوند؟"
    );

  if (!ok) return;

  completedSessions = [];
  sessionData = {};

  saveData();

  showDashboard();
}


/* =========================================================
   SECURITY
========================================================= */

function escapeHtml(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* =========================================================
   START
========================================================= */

renderDashboard();

</script>

<!-- =======================================================

<script>


const app =

/* =========================================================
   NAVIGATION
========================================================= */

function setActiveNav(page) {

  document
    .querySelectorAll(
      ".bottom-nav button"
    )
    .forEach(button => {

      button.classList.remove(
        "active"
      );

    });


  const button =
    document.getElementById(
      `nav-${page}`
    );


  if (button) {

    button.classList.add(
      "active"
    );

  }

}


/* =========================================================
   NAVIGATION / BROWSER HISTORY

   The app is a SPA. Every meaningful screen gets its own
   browser-history entry, so the phone Back button moves to
   the previous app screen instead of leaving the app.
========================================================= */

const INITIAL_HISTORY_STATE = {
  ldo: true,
  page: "home",
  sessionId: null
};

function getCurrentRoute() {

  const state = window.history.state;

  if (
    state &&
    state.ldo === true
  ) {

    return state;

  }

  return INITIAL_HISTORY_STATE;

}

function setRoute(
  page,
  sessionId = null,
  replace = false
) {

  const state = {
    ldo: true,
    page,
    sessionId
  };

  const url = window.location.pathname +
    window.location.search +
    window.location.hash;

  if (replace) {

    window.history.replaceState(
      state,
      "",
      url
    );

  } else {

    window.history.pushState(
      state,
      "",
      url
    );

  }

}

function renderRoute(
  route
) {

  const page =
    route.page || "home";

  if (
    page === "session" &&
    route.sessionId
  ) {

    const session =
      findSession(route.sessionId);

    if (session) {

      setActiveNav("roadmap");
      renderSession(route.sessionId);
      return;

    }

    setRoute("home", null, true);
    renderHome();
    setActiveNav("home");
    return;

  }

  setActiveNav(page);

  if (page === "home") {
    renderHome();
    return;
  }

  if (page === "roadmap") {
    renderRoadmap();
    return;
  }

  if (page === "reviews") {
    renderReviews();
    return;
  }

  if (page === "stats") {
    renderStats();
    return;
  }

  setRoute("home", null, true);
  setActiveNav("home");
  renderHome();

}

function showPage(
  page,
  options = {}
) {

  const pushHistory =
    options.history !== false;

  if (pushHistory) {

    const current =
      getCurrentRoute();

    if (
      current.page !== page ||
      current.sessionId !== null
    ) {

      setRoute(page, null);

    }

  }

  renderRoute({
    page,
    sessionId: null
  });

}

window.addEventListener(
  "popstate",
  function(event) {

    const route =
      event.state &&
      event.state.ldo
        ? event.state
        : INITIAL_HISTORY_STATE;

    renderRoute(route);

  }
);

        </div>

          کل دقیقه
        </div>

      </div>


      <div class="card stat">

        <div class="stat-value">
          ${getCompletedSessionsCount()}
        </div>

        <div class="stat-label">
          Session کامل
        </div>

      </div>


      <div class="card stat">

        <div class="stat-value">
          ${overall}%
        </div>

        <div class="stat-label">
          Progress

      <div class="eyebrow">
        NEXT BEST ACTION

        🎯
        ${getNextAction()}
      </h2>

    </section>


    <section class="card">

/* =========================================================
   ROADMAP
========================================================= */

function renderRoadmap() {

  let html = `

    <section class="card">

      <div class="eyebrow">
        LEARNING ROADMAP
      </div>

      <h2>
        🗺️ Roadmap
      </h2>

      <p class="muted">
        Linux → DevOps → SRE
      </p>

      <p>
        ${getCompletedSessionsCount()}
        /
        ${getAllSessions().length}
        Session
      </p>

    </section>

  `;


  ROADMAP.forEach(
    phase => {

      const locked =
        phase.track ===
        "DevOps / SRE" &&
        !isDevOpsUnlocked();


      let completed = 0;


      phase.sessions.forEach(
        session => {

          if (
            getSessionData(
              session[0]
            ).completion >= 100
          ) {

            completed++;

          }

        }
      );


      const total =
        phase.sessions.length;


      const progress =
        total
          ? Math.round(
              completed /
              total *
              100
            )
          : 0;


      html += `

        <section class="card">

          <div class="phase-header">

            <div>

              <div class="eyebrow">
                ${phase.id}
              </div>

              <h2>
                ${
                  locked
                    ? "🔒"
                    : "🐧"
                }

                ${phase.name}
              </h2>

              <p class="muted">
                ${phase.track}
              </p>

            </div>


            <div class="phase-count">
              ${completed}/${total}
            </div>

          </div>


          <div class="progress">

            <div
              class="progress-bar"
              style="
                width:
                ${progress}%
              "
            ></div>

          </div>


          <p class="muted">
            ${progress}%
          </p>


          <div class="session-list">

      `;


      phase.sessions.forEach(
        session => {

          const id =
            session[0];


          const title =
            session[1];


          const data =
            getSessionData(
              id
            );


          html += `

            <button

              class="
                btn
                secondary
                session-button
                ${
                  locked
                    ? "locked"
                    : ""
                }
              "

              ${
                locked
                  ? "disabled"
                  : ""
              }

              onclick="
                ${
                  locked
                    ? ""
                    : `openSession('${id}')`
                }
              "

            >

              <span>

                ${getStatusIcon(
                  data.learningStatus,
                  data.completion
                )}

                <strong>
                  ${id}
                </strong>

                —
                ${title}

              </span>


              <span>
                ${data.completion || 0}%
              </span>

            </button>

          `;

        }
      );


      html += `

          </div>

        </section>

      `;

    }
  );


  app.innerHTML =
    html;

}


/* =========================================================
   SESSION PAGE
========================================================= */

function openSession(
  sessionId
) {

  const session =
    findSession(
      sessionId
    );


  if (!session) {

    alert(
      "Session پیدا نشد."
    );

    return;

  }


  if (
    session.track ===
      "DevOps / SRE" &&
    !isDevOpsUnlocked()
  ) {

    alert(
      "این بخش تا عبور از Linux Gate قفل است."
    );

    return;

  }


  setCurrentSession(
    sessionId
  );


  setRoute(
    "session",
    sessionId
  );


  renderRoute({
    page: "session",
    sessionId
  });

}

L3=PASSED

/* =========================================================
   STATUS CONTROLS
========================================================= */

function renderStatusButton(
  sessionId,
  status,
  icon
) {

  const current =
    getSessionData(
      sessionId
    ).learningStatus;


  const active =
    current === status
      ? "active"
      : "";


  return `

    <button
      class="
        btn
        secondary
        ${active}
      "
      onclick="
        changeLearningStatus(
          '${sessionId}',
          '${status}'
        )
      "
    >

      ${icon}
      ${formatStatus(status)}

    </button>

  `;

}


function changeLearningStatus(
  sessionId,
  status
) {

  setLearningStatus(
    sessionId,
    status
  );


  renderSession(
    sessionId
  );

}


/* =========================================================
   LAB CONTROLS
========================================================= */

function renderLabButton(
  sessionId,
  status
) {

  const current =
    getSessionData(
      sessionId
    ).labStatus;


  const active =
    current === status
      ? "active"
      : "";


  return `

    <button
      class="
        btn
        secondary
        ${active}
      "
      onclick="
        changeLabStatus(
          '${sessionId}',
          '${status}'
        )
      "
    >
      ${formatLabStatus(status)}
    </button>

  `;

}


function changeLabStatus(
  sessionId,
  status
) {

  setLabStatus(
    sessionId,
    status
  );


  renderSession(
    sessionId
  );

}

              '${level}',

  sessionId,
  level,
  status
) {

  setExerciseStatus(
    sessionId,

    status
  );


  renderSession(
    sessionId
  );

}

   COMPLETION
========================================================= */

function updateCompletionFromSlider(
  sessionId,
  value
) {

  setCompletion(
    sessionId,
    value
  );


  renderSession(
    sessionId
  );

}


function completeSession(
  sessionId
) {

  setCompletion(
    sessionId,
    100
  );


  const data =
    getSessionData(
      sessionId
    );


  if (
    data.learningStatus ===
    "NOT_STARTED"
  ) {

    setLearningStatus(
      sessionId,
      "PRACTICING"
    );

  }


  createReviewsForSession(
    sessionId
  );


  evaluateGates();


  alert(
    `${sessionId} تکمیل شد و Reviewها ساخته شدند.`
  );


  renderSession(
    sessionId
  );

}


/* =========================================================
   TIMER
========================================================= */

function startSessionTimer(
  sessionId
) {

  startStudyTimer(
    sessionId
  );


  renderSession(
    sessionId
  );

}


function stopSessionTimer(
  sessionId
) {

  const minutes =
    stopStudyTimer();


  alert(
    `${minutes} دقیقه ثبت شد.`
  );


  renderSession(
    sessionId
  );

}


/* =========================================================
   NOTES
========================================================= */

function saveSessionNote(
  sessionId
) {

  const textarea =
    document.getElementById(
      "session-note"
    );


  if (!textarea) {

    return;

  }


  const text =
    textarea.value.trim();


  if (!text) {

    alert(
      "یادداشتی وارد نشده."
    );

    return;

  }


  addNote(
    sessionId,
    text
  );


  renderSession(
    sessionId
  );

}


function renderNotes(
  notes
) {

  if (
    !notes ||
    !notes.length
  ) {

    return `
      <p class="muted">
        هنوز یادداشتی ثبت نشده.
      </p>
    `;

  }


  return notes
    .slice()
    .reverse()
    .map(
      note => `

        <div class="card">

          <p>
            ${escapeHtml(
              note.text
            )}
          </p>

          <small class="muted">
            ${
              note.createdAt
                ? new Date(
                    note.createdAt
                  ).toLocaleString(
                    "fa-IR"
                  )
                : ""
            }
          </small>

        </div>

      `
    )
    .join("");

}


/* =========================================================
   RESULT IMPORT
========================================================= */

let LAST_RESULT_PREVIEW = null;


function previewSessionResult() {

  const input =
    document.getElementById(
      "result-input"
    );


  const preview =
    document.getElementById(
      "result-preview"
    );


  if (
    !input ||
    !preview
  ) {

    return;

  }


  const result =
    parseSessionResult(
      input.value
    );


  const validation =
    validateSessionResult(
      result
    );


  LAST_RESULT_PREVIEW =
    result;


  if (
    !validation.valid
  ) {

    preview.innerHTML = `

      <div class="card">

        <h3>
          ❌ Result معتبر نیست
        </h3>

        <ul>

          ${validation.errors
            .map(
              error =>
                `<li>
                  ${escapeHtml(
                    error
                  )}
                </li>`
            )
            .join("")}

        </ul>

      </div>

    `;

    return;

  }


  preview.innerHTML = `

    <div class="card">

      <h3>
        ✅ Preview
      </h3>


      <p>
        Session:
        <strong>
          ${result.session}
        </strong>
      </p>


      <p>
        Completed:
        ${result.completed}
      </p>


      <p>
        Status:
        ${result.status}
      </p>


      <p>
        Study:
        ${result.studyMinutes}
        دقیقه
      </p>


      <p>
        Lab:
        ${result.lab}
      </p>


      <p>
        Assessment:
        ${
          result.assessment === null
            ? "-"
            : result.assessment
        }
      </p>


      <p>
        Strengths:
        ${
          result.strengths.length
            ? result.strengths.join(
                "، "
              )
            : "-"
        }
      </p>


      <p>
        Weaknesses:
        ${
          result.weaknesses.length
            ? result.weaknesses.join(
                "، "
              )
            : "-"
        }
      </p>


      <br>


      <button
        class="btn"
        onclick="
          confirmSessionResultImport()
        "
      >
        ✅ Confirm & Import
      </button>

    </div>

  `;

}


function confirmSessionResultImport() {

  const input =
    document.getElementById(
      "result-input"
    );


  if (!input) {

    return;

  }


  const result =
    parseSessionResult(
      input.value
    );


  const response =
    importSessionResult(
      input.value
    );


  if (
    !response.success
  ) {

    alert(
      response.errors.join(
        "\n"
      )
    );

    return;

  }


  alert(
    `${result.session} با موفقیت Import شد.`
  );


  evaluateGates();


  openSession(
    result.session
  );

}


/* =========================================================
   REVIEWS PAGE
========================================================= */

function renderReviews() {

  const today =
    getTodayDate();


  const pending =
    APP_STATE.reviews
      .filter(
        review =>
          review.status !==
          "DONE"
      );


  const overdue =
    pending.filter(
      review =>
        review.dueDate <
        today
    );


  let html = `

    <section class="card">

      <div class="eyebrow">
        SPACED REPETITION
      </div>

      <h2>
        🔄 Reviews
      </h2>

      <p>
        ${pending.length}
        مرور در انتظار
      </p>

      <p>
        ${overdue.length}
        مرور عقب‌افتاده
      </p>

    </section>

  `;


  if (!pending.length) {

    html += `

      <section class="card">

        <h3>
          ✅ مرور فعالی نداری
        </h3>

        <p class="muted">
          بعد از تکمیل Session،
          مرورهای +1d، +3d، +7d،
          +14d، +30d و +60d ساخته می‌شوند.
        </p>

      </section>

    `;

  }


  pending
    .sort(
      (a, b) =>
        String(a.dueDate)
          .localeCompare(
            String(b.dueDate)
          )
    )
    .forEach(
      review => {

        const session =
          findSession(
            review.session
          );


        html += `

          <section class="card">

            <div class="eyebrow">
              ${review.type}
            </div>

            <h3>
              ${review.session}
            </h3>

            <p>
              ${
                session
                  ? session.title
                  : ""
              }
            </p>

            <p>
              📅
              ${review.dueDate}
            </p>


            ${
              review.dueDate <
              today
                ? `
                  <p>
                    ⚠️ Overdue
                  </p>
                `
                : ""
            }


            <button
              class="btn"
              onclick="
                openReview(
                  '${review.id}'
                )
              "
            >
              شروع مرور
            </button>

          </section>

        `;

      }
    );


  app.innerHTML =
    html;

}


/* =========================================================
   OPEN REVIEW
========================================================= */

function openReview(
  reviewId
) {

  const review =
    APP_STATE.reviews.find(
      item =>
        item.id ===
        reviewId
    );


  if (!review) {

    return;

  }


  const session =
    findSession(
      review.session
    );


  app.innerHTML = `

    <section class="card">

      <button
        class="btn secondary"
        onclick="
          showPage('reviews')
        "
      >
        ← Reviews
      </button>


      <br>
      <br>


      <div class="eyebrow">
        ${review.type}
      </div>


      <h2>
        ${review.session}
      </h2>


      <h3>
        ${
          session
            ? session.title
            : ""
        }
      </h3>


      <p>
        این مرور را با ChatGPT انجام بده.
      </p>


      <br>


      <label>
        Review Score
      </label>


      <input
        id="review-score"
        type="number"
        min="0"
        max="100"
        placeholder="0 - 100"
        style="
          width:100%;
          padding:12px;
          border-radius:12px;
        "
      >


      <br>
      <br>


      <label>
        Note
      </label>


      <textarea
        id="review-note"
        rows="5"
        style="
          width:100%;
          padding:12px;
          border-radius:12px;
        "
      ></textarea>


      <br>
      <br>


      <button
        class="btn"
        onclick="
          finishReview(
            '${reviewId}'
          )
        "
      >
        ✅ تکمیل Review
      </button>

    </section>

  `;

}


function finishReview(
  reviewId
) {

  const scoreInput =
    document.getElementById(
      "review-score"
    );


  const noteInput =
    document.getElementById(
      "review-note"
    );


  const score =
    scoreInput &&
    scoreInput.value !== ""
      ? Number(
          scoreInput.value
        )
      : null;


  const note =
    noteInput
      ? noteInput.value
      : "";


  completeReview(
    reviewId,
    score,
    note
  );


  alert(
    "Review ثبت شد."
  );


  showPage(
    "reviews"
  );

}

/* =========================================================
   SECURITY / HTML
========================================================= */

function escapeHtml(
  value
) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

function formatExerciseStatus(
  status
) {

  switch(status) {

    case "PASSED":
      return "✅ Passed";

    case "FAILED":
      return "❌ Failed";

    case "IN_PROGRESS":
      return "🟡 In Progress";

    case "LOCKED":
      return "🔒 Locked";

    default:
      return "⚪ Not Started";

  }

}


function formatLabStatus(
  status
) {

  switch(status) {

    case "PASSED":
      return "✅ Passed";

    case "FAILED":
      return "❌ Failed";

    case "IN_PROGRESS":
      return "🟡 In Progress";

    case "SKIPPED":
      return "⏭ Skipped";

    default:
      return "⚪ Not Started";

  }

}
